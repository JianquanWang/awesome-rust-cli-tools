# awesome-rust-tools - 工具映射定义
# 命名规则: 主映射 = [tool]-rs (例如 find-rs); 次选 = 原 binary 名
# 所有安装命令（apt/cargo/brew/dnf/pacman）必须存在，安装时按本机包管理器选择

mappings:
  - name: find-rs
    tool: sharkdp/fd
    binary: fd
    replaces: find
    desc: "Fast and user-friendly find alternative"
    speed: "5-10x faster than find"
    mem: "1/3 to 1/5 of find"
    size: "~1.4MB"
    src: "github.com/sharkdp/fd#benchmark"
    apt: "fd"
    cargo: "fd"
    brew: "fd"
    dnf: "fd"
    pacman: "fd"
  - name: grep-rs
    tool: BurntSushi/ripgrep
    binary: rg
    replaces: grep
    desc: "Line-oriented regex search (grep alternative)"
    speed: "4-20x faster than GNU grep"
    mem: "< 1/2 of grep"
    size: "~4MB"
    src: "github.com/BurntSushi/ripgrep#benchmark"
    apt: "ripgrep"
    cargo: "ripgrep"
    brew: "ripgrep"
    dnf: "ripgrep"
    pacman: "ripgrep"
